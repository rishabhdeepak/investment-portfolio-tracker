<aside class="relative sticky top-0 w-64 h-screen flex-shrink-0 bg-slate-900 border-r border-slate-800">

    <div class="p-6">

        <p class="text-xs uppercase tracking-widest text-slate-500 mb-6">
            Navigation
        </p>

        <ul class="space-y-2">

            <li>

                <a href="{% url 'dashboard' %}"
                   class="flex items-center rounded-xl px-4 py-3
                          text-slate-300
                          hover:bg-slate-800
                          hover:text-white
                          transition">

                    <i data-lucide="layout-dashboard"
                       class="w-5 h-5">
                    </i>

                    <span class="ml-3">
                        Dashboard
                    </span>

                </a>

            </li>


            <li>

                <a href="{% url 'create_portfolio' %}"
                   class="flex items-center rounded-xl px-4 py-3
                          text-slate-300
                          hover:bg-slate-800
                          hover:text-white
                          transition">

                    <i data-lucide="briefcase-business"
                       class="w-5 h-5">
                    </i>

                    <span class="ml-3">
                        Create Portfolio
                    </span>

                </a>

            </li>

        </ul>

    </div>


    <div class="absolute bottom-8 left-6">

        {% if request.user.is_authenticated %}

            <a href="{% url 'logout' %}"
               class="flex items-center gap-3
                      text-red-400
                      hover:text-red-300
                      transition">

                <i data-lucide="log-out"
                   class="w-5 h-5">
                </i>

                <span>
                    Logout
                </span>

            </a>

        {% else %}

            <div class="space-y-3">

                <a href="{% url 'login' %}"
                   class="flex items-center gap-3
                          text-slate-300
                          hover:text-white
                          transition">

                    <i data-lucide="log-in"
                       class="w-5 h-5">
                    </i>

                    <span>
                        Login
                    </span>

                </a>


                <a href="{% url 'register' %}"
                   class="flex items-center gap-3
                          text-slate-300
                          hover:text-white
                          transition">

                    <i data-lucide="user-plus"
                       class="w-5 h-5">
                    </i>

                    <span>
                        Register
                    </span>

                </a>

            </div>

        {% endif %}

    </div>

</aside>
