<div class="mb-10">

    <div class="flex justify-between items-start">

        <!-- Portfolio Information -->

        <div>

            <p class="wt-label mb-2">
                PORTFOLIO
            </p>

            <h1 class="text-5xl font-bold tracking-tight">
                {{ portfolio.name }}
            </h1>

            <div class="flex gap-6 mt-4 text-sm text-slate-400">

                <span>
                    {{ portfolio.base_currency }}
                </span>

                <span>
                    {{ holdings|length }} Assets
                </span>

                <span>
                    Created {{ portfolio.created_at|date:"d M Y" }}
                </span>

            </div>

        </div>


        <!-- Portfolio Actions -->

        <div class="flex items-center gap-3">

            <!-- New Transaction -->

            <a href="{% url 'create_transaction' portfolio.id %}"
               class="btn btn-primary flex items-center gap-2">

                <i data-lucide="plus"
                   class="w-4 h-4">
                </i>

                <span>
                    New Transaction
                </span>

            </a>


            <!-- Edit Portfolio -->

            <a href="{% url 'update_portfolio' portfolio.id %}"
               class="btn btn-outline flex items-center gap-2">

                <i data-lucide="pencil"
                   class="w-4 h-4">
                </i>

                <span>
                    Edit
                </span>

            </a>


            <!-- Delete Portfolio -->

            <a href="{% url 'delete_portfolio' portfolio.id %}"
               class="btn btn-outline flex items-center gap-2"
               style="
                   border-color: #ef4444;
                   color: #f87171;
               "
               onmouseover="
                   this.style.backgroundColor='rgba(239,68,68,0.1)';
                   this.style.borderColor='#f87171';
                   this.style.color='#fca5a5';
               "
               onmouseout="
                   this.style.backgroundColor='';
                   this.style.borderColor='#ef4444';
                   this.style.color='#f87171';
               ">

                <i data-lucide="trash-2"
                   class="w-4 h-4">
                </i>

                <span>
                    Delete
                </span>

            </a>

        </div>

    </div>

</div>
